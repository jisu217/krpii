name: Release

# Builds the krpii binary for every supported platform and publishes the
# archives to a GitHub Release when a version tag such as v0.1.0 is pushed.
# Release notes are generated from the merged pull request titles.
#
# Running the workflow manually builds and uploads the archives as workflow
# artifacts without creating a release, which tests the pipeline before tagging.
#
# Release checklist (a version published to crates.io can never be replaced):
#
#   1. Bump the version in the root Cargo.toml, in both [workspace.package]
#      and the krpii-core entry of [workspace.dependencies], and merge.
#   2. Optionally run this workflow manually to dry-run the builds.
#   3. From an up-to-date main, publish the crates; krpii-core goes first:
#        cargo publish --workspace --dry-run && cargo publish --workspace
#   4. Tag and push, which triggers this workflow:
#        git tag -a vX.Y.Z -m "vX.Y.Z" && git push origin vX.Y.Z

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the crate version
        run: |
          crate_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "krpii") | .version')
          if [ "v${crate_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match crate version ${crate_version}"
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    # Runs after a successful version check on tags, and on its own for manual runs.
    if: ${{ !cancelled() && needs.verify.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds link musl statically, so they run on any distribution.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        uses: houseabsolute/actions-rust-cross@v1
        with:
          target: ${{ matrix.target }}
          args: --locked --release -p krpii
          strip: true

      - name: Package
        shell: bash
        run: |
          # Tags name the archive after the version; manual runs use the commit,
          # since branch names may contain slashes.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            label="${GITHUB_REF_NAME}"
          else
            label="dev-${GITHUB_SHA::7}"
          fi
          name="krpii-${label}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/krpii.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
            archive="$name.zip"
          else
            cp "target/${{ matrix.target }}/release/krpii" "$name/"
            tar -czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
