[workspace]
resolver = "3"
members = ["crates/krpii-core", "crates/krpii", "benchmarks"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
readme = "README.md"
authors = ["jisu217"]
repository = "https://github.com/jisu217/krpii"
homepage = "https://github.com/jisu217/krpii"
keywords = ["pii", "privacy", "korean", "masking", "anonymization"]
categories = ["text-processing", "command-line-utilities"]

[workspace.dependencies]
krpii-core = { path = "crates/krpii-core", version = "0.1.0" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
# The CLI runs on every hook invocation, so favour a small, fast binary.
lto = true
codegen-units = 1
strip = true
